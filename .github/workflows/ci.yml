name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
  build:
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node:
          - '14'
          - '15'
          - '16'
          - '18'
          - '20'
          - '22'
          - '23'
          - '24'
        os:
          - ubuntu-latest
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    env:
      GAUSSUSER: ci_user
      GAUSSPASSWORD: openGauss@123
      GAUSSHOST: localhost
      GAUSSDATABASE: ci_db_test
      GAUSSTESTNOSSL: 'true'
      SHA256_TEST_GAUSSUSER: sha256_test
      SHA256_TEST_GAUSSPASSWORD: test4@scram
      DB_TYPE: opengauss
      LOGICAL_REPLICATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build database test image
        run: docker build -f .github/ci/Dockerfile.opengauss -t gaussdb-node-ci:openblas .github/ci
      - name: Start database
        run: |
          docker run -d --name gaussdb-node-ci -p 5432:5432 \
            -e GS_USERNAME=ci_user -e GS_PASSWORD=openGauss@123 \
            -e GS_USER_PASSWORD=openGauss@123 -e GS_DB=postgres \
            -e GS_HOST_AUTH_METHOD=md5 gaussdb-node-ci:openblas
      - name: Wait for GaussDB to be ready
        run: bash .github/ci/wait-for-db.sh gaussdb-node-ci
      - name: Configure SHA256 authentication and logical replication
        run: bash .github/ci/configure-db.sh gaussdb-node-ci
      # Install/build with the toolchain's supported Node.js version. Older
      # runtimes still execute the tests, without installing modern dev tools.
      - name: Setup build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: node .github/ci/prepare-tests.cjs
      - name: Setup test Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: |
          if [[ "${{ matrix.node }}" -lt 18 ]]; then
            # node:test is unavailable here; exercise the same public imports
            # using an assert-based smoke test on the actual target runtime.
            node .github/ci/import-smoke.mjs
            yarn --cwd packages/gaussdb-connection-string nyc --include=index.js --reporter=lcov mocha --no-config 'dist/*.js'
            yarn --cwd packages/gaussdb-connection-string check-coverage
            yarn lerna exec --ignore gaussdb-esm-test --ignore gaussdb-connection-string --concurrency 1 yarn test
          else
            yarn test
          fi
      - name: Database diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs gaussdb-node-ci || true
      - name: Stop database
        if: always()
        run: docker rm -fv gaussdb-node-ci || true
