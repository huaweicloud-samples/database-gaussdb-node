name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify npm authentication without building or publishing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Verify npm publishing identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org/

      - name: Install dependencies
        if: ${{ !inputs.check_only }}
        run: yarn install --frozen-lockfile
      
      - name: Build packages
        if: ${{ !inputs.check_only }}
        run: yarn build
      
      - name: Publish to npm
        if: ${{ !inputs.check_only && (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn lerna publish from-package --yes --no-verify-access
